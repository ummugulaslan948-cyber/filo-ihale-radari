name: Günlük ihale taraması

on:
  schedule:
    # Hafta içi 07:40 (Türkiye saati) = 04:40 UTC
    - cron: "40 4 * * 1-5"
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ayrıştırıcı testleri
        run: python -m unittest tarayici/test_tara.py

      - name: İlanları tara
        run: python tarayici/tara.py

      - name: Yeni veriyi kaydet
        run: |
          git config user.name "ihale-radari-bot"
          git config user.email "ihale-radari-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Tarama $(date +%Y-%m-%d)"
          git push
